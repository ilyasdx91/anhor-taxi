<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#FFE15C" />
      <stop offset="55%" stop-color="#FFD400" />
      <stop offset="100%" stop-color="#EF6E03" />
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2D1F6B" stop-opacity="0.6" />
      <stop offset="60%"  stop-color="#0800BF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1A1A2E" />
      <stop offset="100%" stop-color="#0B0B18" />
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.38" r="0.55">
      <stop offset="0%"   stop-color="#FFD400" stop-opacity="0.2" />
      <stop offset="60%"  stop-color="#FFD400" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFD400" stop-opacity="0" />
    </radialGradient>
    <filter id="car-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="16" />
      <feComponentTransfer><feFuncA type="linear" slope="0.45" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- ═══ ФОН ═══ -->
  <rect width="640" height="560" rx="24" fill="url(#sky)" />
  <rect width="640" height="560" rx="24" fill="url(#glow)" />

  <!-- ═══ ЗВЁЗДЫ ═══ -->
  <g class="hero-stars" fill="#FFD400" opacity="0.85">
    <circle cx="60"  cy="60"  r="2.5" />
    <circle cx="140" cy="32"  r="1.8" />
    <circle cx="220" cy="90"  r="2" />
    <circle cx="550" cy="50"  r="2" />
    <circle cx="605" cy="120" r="1.5" />
    <circle cx="45"  cy="165" r="1.8" />
    <circle cx="580" cy="220" r="1.5" />
    <circle cx="95"  cy="225" r="1.5" />
    <circle cx="320" cy="40"  r="1.8" />
    <circle cx="480" cy="25"  r="1.5" />
  </g>
  <g class="hero-stars-x" stroke="#FFD400" stroke-width="1.4" stroke-linecap="round" opacity="0.65">
    <path d="M60 52 L60 68 M52 60 L68 60" />
    <path d="M550 42 L550 58 M542 50 L558 50" />
    <path d="M220 82 L220 98 M212 90 L228 90" />
  </g>

  <!-- ═══ СОЛНЦЕ ═══ -->
  <g class="hero-sun">
    <circle cx="400" cy="200" r="140" fill="url(#sun)" />
    <circle cx="400" cy="200" r="162" fill="none" stroke="#FFD400" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="4 10" />
    <circle cx="400" cy="200" r="188" fill="none" stroke="#FFD400" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="3 14" />
  </g>

  <!-- ═══ ГОРОД ═══ -->
  <g class="hero-city" fill="url(#city)">
    <rect x="0"   y="340" width="50" height="80" />
    <rect x="50"  y="320" width="40" height="100" />
    <rect x="90"  y="350" width="36" height="70" />
    <rect x="130" y="270" width="14" height="150" />
    <path d="M 130 270 L 137 250 L 144 270 Z" />
    <circle cx="137" cy="260" r="6" />
    <rect x="158" y="320" width="70" height="100" />
    <path d="M 158 320 Q 193 280 228 320" />
    <rect x="190" y="288" width="6" height="16" />
    <path d="M 190 288 L 193 278 L 196 288 Z" />
    <rect x="240" y="290" width="48" height="130" />
    <rect x="300" y="250" width="12" height="170" />
    <path d="M 300 250 L 306 232 L 312 250 Z" />
    <rect x="325" y="310" width="60" height="110" />
    <rect x="395" y="280" width="54" height="140" />
    <rect x="460" y="260" width="12" height="160" />
    <path d="M 460 260 L 466 240 L 472 260 Z" />
    <rect x="485" y="340" width="40" height="80" />
    <rect x="525" y="320" width="50" height="100" />
    <rect x="575" y="350" width="40" height="70" />
    <rect x="615" y="330" width="25" height="90" />
  </g>
  <g class="hero-windows" fill="#FFD400" opacity="0.8">
