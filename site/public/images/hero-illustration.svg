    <rect x="212" y="535" width="28" height="5" rx="2.5" />
    <rect x="260" y="535" width="28" height="5" rx="2.5" />
    <rect x="308" y="535" width="28" height="5" rx="2.5" />
    <rect x="356" y="535" width="28" height="5" rx="2.5" />
    <rect x="404" y="535" width="28" height="5" rx="2.5" />
    <rect x="452" y="535" width="28" height="5" rx="2.5" />
    <rect x="500" y="535" width="28" height="5" rx="2.5" />
    <rect x="548" y="535" width="28" height="5" rx="2.5" />
    <rect x="596" y="535" width="28" height="5" rx="2.5" />
  </g>
</svg>
